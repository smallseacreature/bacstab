name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - "bacstab/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install tomli
          python - <<'PY'
          import os
          import tomli
          with open("pyproject.toml", "rb") as f:
              version = tomli.load(f)["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          PY
      - name: Build distributions
        run: python -m build
      - name: Check package metadata
        run: python -m twine check --strict dist/*
      - name: Test installed wheel
        run: |
          python -m venv /tmp/bacstab-check
          /tmp/bacstab-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/bacstab-check/bin/python -c "import bacstab; print(bacstab.__file__)"
          /tmp/bacstab-check/bin/python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bacstab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
